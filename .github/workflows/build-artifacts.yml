name: Build Artifacts

on:
  push:
    branches:
      - "feature/**"
      - "release/ci"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: cc-switch-darwin-x86_64
            artifact_path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cc-switch-windows-x86_64
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run reasoning-level unit tests
        if: runner.os == 'macOS'
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml catalog_model_entry

      - name: Prepare unsigned build configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;

          if (process.env.GITHUB_REF.startsWith("refs/heads/feature/")) {
            config.productName = "CC Switch Test";
            config.identifier = "com.ccswitch.desktop.test";
            config.app.windows[0].title = "CC Switch Test";
            config.plugins["deep-link"].desktop.schemes = ["ccswitch-test"];
            config.plugins.updater.endpoints = [
              "https://cc-switch-test.invalid/latest.json",
            ];
          }

          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          console.log({
            productName: config.productName,
            identifier: config.identifier,
            createUpdaterArtifacts: config.bundle.createUpdaterArtifacts,
          });
          NODE

      - name: Build Tauri App (macOS x86_64)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: Build Tauri App (Windows x86_64)
        if: runner.os == 'Windows'
        run: pnpm tauri build

      - name: Prepare isolated Windows portable test bundle
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/heads/feature/')
        shell: pwsh
        run: |
          $bundle = "artifacts/windows-isolated"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "src-tauri/target/release/cc-switch.exe" "$bundle/cc-switch-test.exe"
          @'
          @echo off
          setlocal
          set "CC_SWITCH_TEST_HOME=%LOCALAPPDATA%\CCSwitch-Test"
          if not exist "%CC_SWITCH_TEST_HOME%" mkdir "%CC_SWITCH_TEST_HOME%"
          start "CC Switch Test" "%~dp0cc-switch-test.exe"
          '@ | Set-Content -Encoding ascii "$bundle/run-isolated.cmd"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact_path }}
            artifacts/**
          if-no-files-found: error
